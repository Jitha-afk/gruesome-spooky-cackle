name: pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install PyYAML
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Test
        run: node --test scripts/test_brief.mjs

      - name: Check schema v1 data
        continue-on-error: true
        run: |
          set -eu
          for f in reports/*/data.json; do
            [ -e "$f" ] || continue
            python3 scripts/check_schema_v1.py "$f"
          done

      - name: Check brief.md
        run: |
          set -eu
          for f in reports/*/brief.md; do
            [ -e "$f" ] || continue
            python3 scripts/check_schema_v1.py "$f"
          done

      - name: Build
        run: node scripts/build_site.mjs

      - name: Test built site
        run: node --test scripts/test_site.mjs

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
